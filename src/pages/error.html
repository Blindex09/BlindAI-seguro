<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
  <title>Blind AI - Erro ao iniciar</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --text:#f8fafc; --muted:#cbd5e1; --accent:#38bdf8; --border:#334155; --danger:#f87171; --focus:#facc15; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    main { max-width: 760px; width: 100%; background: var(--card); border: 2px solid var(--danger); border-radius: 16px; padding: 2.5rem; }
    h1 { color: var(--danger); font-size: 1.8rem; margin-bottom: 1rem; }
    p { font-size: 1.15rem; line-height: 1.6; color: var(--muted); margin-bottom: 0.75rem; }
    #reason { color: var(--text); font-weight: 600; }
    code { background: #0b0f19; padding: 0.1rem 0.4rem; border-radius: 4px; word-break: break-all; }
    pre { background: #0b0f19; border: 1px solid var(--border); border-radius: 8px; padding: 1rem; max-height: 220px; overflow: auto; font-size: 0.95rem; white-space: pre-wrap; word-break: break-word; margin: 0.5rem 0 1rem; }
    .actions { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem; }
    button { background: #1e3a8a; color: #fff; border: 2px solid #3b82f6; border-radius: 8px; padding: 0.9rem 1.4rem; font-size: 1.1rem; font-weight: 600; cursor: pointer; }
    button:hover { background: #2563eb; }
    button:focus-visible { outline: 4px solid var(--focus); outline-offset: 4px; }
  </style>
</head>
<body>
  <main role="alert">
    <h1 id="title" tabindex="-1">Não foi possível iniciar o Blind AI</h1>
    <p id="reason">O serviço local não ficou pronto.</p>
    <div id="output-wrap" hidden>
      <p>Últimas linhas do serviço:</p>
      <pre id="output" tabindex="0" aria-label="Últimas linhas de saída do serviço"></pre>
    </div>
    <p>Arquivos de log: <code id="logdir">-</code></p>
    <div class="actions">
      <button type="button" id="retry">Tentar novamente</button>
      <button type="button" id="logs">Abrir pasta de logs</button>
    </div>
    <p id="feedback" role="status" aria-live="polite"></p>
  </main>
  <script src="error.js"></script>
</body>
</html>
